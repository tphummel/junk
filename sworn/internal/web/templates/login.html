{{define "content"}}
<h1>Sign in</h1>
<form id="login-form" class="card">
  <label>Username <input name="username" autocomplete="username webauthn" required autofocus></label>
  <button type="submit">Sign in with passkey</button>
  <p id="msg" class="err" role="alert"></p>
</form>
{{if .Data.CanRegister}}<p><a href="/register">Create an account</a></p>{{end}}
{{end}}
