services:
  sworn:
    # build: .            # or build locally instead of pulling
    image: ghcr.io/tphummel/sworn:main
    container_name: sworn
    restart: unless-stopped
    ports:
      # Bind to the LAN address only; put Caddy in front for HTTPS (see README).
      - "192.168.1.50:8080:8080"
    environment:
      # WebAuthn needs the exact hostname/origin users type in the browser.
      RP_ID: "${RP_ID:-sworn.home.example}"
      RP_ORIGINS: "${RP_ORIGINS:-https://sworn.home.example}"
      # Optional: enables "Push to OSM". Leave empty to keep OSM read-only.
      OSM_API_KEY: "${OSM_API_KEY:-}"
      OSM_USER_ID: "${OSM_USER_ID:-}"
      BIND: "0.0.0.0"
    volumes:
      - ./data:/data
