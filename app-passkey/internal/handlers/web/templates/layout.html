{{define "layout"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{block "title" .}}app-passkey{{end}}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">app-passkey</a>
    {{if .Authenticated}}
    <nav>
      <a href="/home">Home</a>
      <a href="/keys">Keys</a>
      <a href="/admin">Admin</a>
      <button type="button" id="logout-btn">Log out</button>
    </nav>
    {{end}}
  </header>
  <main>
    {{template "content" .}}
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
{{end}}
