<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>controller lab</title>
  <style>
    :root {
      color-scheme: light dark;
      /* golden-angle seed: #D22F2D cw */
      /* >= 4.5:1 on #FFFFFF (light) and #111111 (dark) */
      --primary: #D22F2D;
      --support: #A15F5F;
      --accent:  #1D883E;
      --bg: #FFFFFF;
      --text: #111111;
      /* Player slots: the seed's hue turned by the golden angle, one step per slot, each >= 3:1 on the background
         (borders) with the text color that reads best on it (>= 4.5:1). */
      --slot-1: #D22F2D; --slot-1-ink: #FFFFFF;
      --slot-2: #25AA4D; --slot-2-ink: #111111;
      --slot-3: #8F2DD2; --slot-3-ink: #FFFFFF;
      --slot-4: #A59623; --slot-4-ink: #111111;
      --slot-5: #29A2BD; --slot-5-ink: #111111;
      --slot-6: #D22D84; --slot-6-ink: #FFFFFF;
      --slot-7: #44A924; --slot-7-ink: #111111;
      --slot-8: #362DD2; --slot-8-ink: #FFFFFF;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #D84B49;
        --support: #A86C6C;
        --accent:  #2DD25F;
        --bg: #111111;
        --text: #EEEEEE;
        --slot-1: #D22F2D; --slot-1-ink: #FFFFFF;
        --slot-2: #2DD25F; --slot-2-ink: #111111;
        --slot-3: #8F2DD2; --slot-3-ink: #FFFFFF;
        --slot-4: #D2BF2D; --slot-4-ink: #111111;
        --slot-5: #2DB4D2; --slot-5-ink: #111111;
        --slot-6: #D22D84; --slot-6-ink: #FFFFFF;
        --slot-7: #54D22D; --slot-7-ink: #111111;
        --slot-8: #524BD8; --slot-8-ink: #FFFFFF;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
    .wrap { max-width: 2200px; margin: 0 auto; padding: 16px; }
    h1 { margin: 0 0 4px; font-size: 1.6rem; color: var(--primary); }
    h2 { margin: 0 0 8px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--primary); }
    .lede { margin: 0 0 8px; max-width: 70ch; }
    .muted { color: var(--support); }
    #status { margin: 0 0 16px; font-variant-numeric: tabular-nums; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-items: start; }
    @media (min-width: 1000px) { .layout { grid-template-columns: minmax(0, 1fr) minmax(420px, 46%); } }
    .pads { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 10px; }
    #waiting { margin: 0 0 12px; }
    #waiting p { margin: 0 0 4px; overflow-wrap: anywhere; }
    .empty { padding: 24px; border: 2px dashed var(--support); border-radius: 10px; }

    /* One card per controller. Every child may shrink (minmax(0, 1fr)) so a long name or a pad with many axes can
       never make the card wider than its column; text wraps or is cut with an ellipsis instead. */
    .pad {
      --c: var(--slot-1); --ink: var(--slot-1-ink);
      min-width: 0; border: 2px solid var(--c); border-radius: 10px; padding: 8px 10px;
      display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; align-content: start; overflow: hidden;
    }
    .pad > * { min-width: 0; }
    .pad.gone { opacity: 0.55; border-style: dashed; }
    .pad.flash { box-shadow: 0 0 0 4px var(--c); }
    .pad header { display: flex; align-items: center; gap: 8px; }
    .badge { flex: none; padding: 1px 9px; border-radius: 999px; background: var(--c); color: var(--ink); font-weight: 700; }
    .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .state { flex: none; font-size: 0.72rem; color: var(--support); }
    .pad p { margin: 0; font-size: 0.76rem; overflow-wrap: anywhere; }
    .pad .last { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .buttons { display: grid; grid-template-columns: repeat(auto-fill, minmax(30px, 1fr)); gap: 3px; }
    .b {
      --v: 0;
      height: 24px; display: grid; place-items: center; font-size: 0.62rem; border: 1px solid var(--support); border-radius: 5px;
      background: linear-gradient(to top, color-mix(in srgb, var(--c) 55%, transparent) calc(var(--v) * 100%), transparent 0);
      overflow: hidden; white-space: nowrap; min-width: 0;
    }
    .b.on { background: var(--c); color: var(--ink); border-color: var(--c); font-weight: 700; }
    /* Axes in two columns where there is room. Only the first four, and any that have moved, are shown. */
    .axes { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 2px 10px; }
    .axis { display: grid; grid-template-columns: 2.4em minmax(0, 1fr) 2.8em; align-items: center; gap: 4px; font-size: 0.66rem; font-variant-numeric: tabular-nums; }
    .axis[hidden] { display: none; }
    .axis > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .track { position: relative; height: 8px; border: 1px solid var(--support); border-radius: 4px; }
    .track::before { content: ""; position: absolute; left: 50%; top: -1px; bottom: -1px; width: 1px; background: var(--support); }
    .track i { position: absolute; top: 0; bottom: 0; background: var(--c); border-radius: 3px; }
    .tools { display: flex; gap: 6px; flex-wrap: wrap; }
    button.tool {
      font: inherit; font-size: 0.78rem; padding: 2px 9px; border: 0; border-radius: 4px;
      background: var(--primary); color: var(--bg); cursor: pointer;
    }
    button.tool.quiet { background: transparent; color: var(--text); border: 1px solid var(--support); }
    .pad .tool { padding: 1px 8px; font-size: 0.74rem; }
    .perfbox summary { cursor: pointer; font-size: 0.72rem; color: var(--support); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .perf { font-size: 0.72rem; line-height: 1.4; font-variant-numeric: tabular-nums; margin-top: 3px; }
    .perf span { display: block; overflow-wrap: anywhere; }

    .logpanel { display: flex; flex-direction: column; min-height: 320px; }
    @media (min-width: 1000px) { .logpanel { position: sticky; top: 12px; height: calc(100dvh - 24px); } }
    .tabs, .views { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .tab {
      --c: var(--primary); --ink: var(--bg);
      font: inherit; font-size: 0.85rem; padding: 2px 11px; border: 2px solid var(--c); border-radius: 999px;
      background: transparent; color: var(--text); cursor: pointer;
    }
    .tab[aria-selected="true"] { background: var(--c); color: var(--ink); font-weight: 700; }
    .views .tab { --c: var(--support); --ink: var(--bg); font-size: 0.78rem; padding: 1px 10px; }
    .views .tab[aria-selected="true"] { --c: var(--primary); }
    .logbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; font-size: 0.82rem; }
    .logbar label { display: inline-flex; align-items: center; gap: 4px; }
    .logbar select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--support); border-radius: 4px; }
    .thead { margin: 0; padding: 3px 8px; font: 0.7rem ui-monospace, monospace; color: var(--support); border: 1px solid var(--support); border-bottom: 0; border-radius: 8px 8px 0 0; white-space: pre; }
    #transcript {
      margin: 0; padding: 6px 8px; flex: 1; min-height: 200px; overflow: auto; white-space: pre; tab-size: 4;
      font: 0.74rem/1.5 ui-monospace, monospace; border: 1px solid var(--support); border-radius: 0 0 8px 8px;
    }
    #transcript.stats { border-radius: 8px; }
    .haptics { flex: 1; min-height: 200px; overflow: auto; border: 1px solid var(--support); border-radius: 8px; padding: 8px 12px; font-size: 0.85rem; }
    .haptics[hidden] { display: none; }
    .haptics p { margin: 0 0 8px; overflow-wrap: anywhere; }
    .hap-grid { display: grid; gap: 4px; margin-bottom: 8px; }
    .hap-grid label { display: grid; grid-template-columns: 8.5em minmax(0, 1fr) 4.5em; align-items: center; gap: 8px; }
    .hap-grid label:first-child { grid-template-columns: 8.5em max-content; }
    .hap-grid input[type="range"] { width: 100%; min-width: 0; accent-color: var(--primary); }
    .hap-grid output { font-variant-numeric: tabular-nums; }
    .hap-grid label.off { opacity: 0.45; }
    .hap-grid select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--support); border-radius: 4px; }
    .hap-h { margin: 10px 0 4px; font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--primary); }
    .hap-results { margin: 0; padding: 0; list-style: none; font: 0.76rem/1.5 ui-monospace, monospace; }
    .hap-results li { padding: 1px 0; overflow-wrap: anywhere; }
    #note { margin: 8px 0 0; min-height: 1.2em; font-size: 0.82rem; }
    .fast { margin: 0 0 12px; font-size: 0.85rem; }
    .env { margin: 0 0 12px; font-size: 0.85rem; max-width: 100ch; }
    .env summary { cursor: pointer; }
    .env dl { margin: 6px 0 0; display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; }
    .env dt { color: var(--primary); }
    .env dd { margin: 0; }
    .env .na { margin-top: 8px; display: block; }
    .env .na dd { margin: 0 0 8px; }
    .env .na dt { color: var(--text); font-weight: 700; }
    .devinfo { font-size: 0.74rem; line-height: 1.35; }
    .devinfo span { display: block; overflow-wrap: anywhere; }
    .devinfo .na { color: var(--support); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
  <meta name="theme-color" content="#111111">
  <link rel="icon" href="/controller-lab/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/controller-lab/apple-touch-icon.png">
  <link rel="manifest" href="/controller-lab/manifest.webmanifest">
</head>
<body>
  <div class="wrap">
    <h1>controller lab</h1>
    <p class="lede">Press a button on each controller to register it: the first to press is P1, the next P2, and so on. Every button and stick move is logged with the player and a time.</p>
    <p id="status" class="muted" aria-live="polite">Looking for controllers...</p>
    <details class="env" id="env"><summary id="env-summary">This browser</summary><div id="env-body"></div></details>
    <p class="fast"><label><input type="checkbox" id="fast" checked> Poll faster than the screen refreshes (up to about 250 Hz where the browser allows it), so controllers that report more than 60 times a second can be measured</label></p>
    <div class="layout">
      <section aria-labelledby="pads-h">
        <h2 id="pads-h">Controllers</h2>
        <div id="waiting"></div>
        <div id="pads" class="pads"></div>
      </section>
      <section class="logpanel" aria-labelledby="log-h">
        <h2 id="log-h">Transcript</h2>
        <div class="tabs" id="tabs" role="tablist" aria-label="Whose transcript"></div>
        <div class="views" id="views" role="tablist" aria-label="What to show" hidden>
          <button class="tab" id="view-transcript" role="tab" type="button">Transcript</button>
          <button class="tab" id="view-stats" role="tab" type="button">Stats</button>
          <button class="tab" id="view-haptics" role="tab" type="button">Haptics</button>
          <button class="tool quiet" id="reset-stats" type="button" hidden>Reset stats</button>
        </div>
        <div class="logbar">
          <button class="tool" id="pause" type="button">Pause log</button>
          <button class="tool quiet" id="clear" type="button">Clear</button>
          <label><input type="checkbox" id="follow" checked> Follow</label>
          <label>Show <select id="limit"><option value="500">last 500</option><option value="3000" selected>last 3000</option><option value="0">all</option></select></label>
        </div>
        <div class="logbar">
          <button class="tool" id="download-txt" type="button">Download text</button>
          <button class="tool" id="download-json" type="button">Download JSON</button>
          <button class="tool quiet" id="copy" type="button">Copy text</button>
        </div>
        <div class="haptics" id="haptics" hidden>
          <p id="hap-status" class="muted"></p>
          <div class="hap-grid">
            <label>Effect <select id="hap-effect"><option value="dual-rumble">dual-rumble</option><option value="trigger-rumble">trigger-rumble</option></select></label>
            <label>Strong motor <input id="hap-strong" type="range" min="0" max="1" step="0.05" value="1"><output id="hap-strong-o">1.00</output></label>
            <label>Weak motor <input id="hap-weak" type="range" min="0" max="1" step="0.05" value="1"><output id="hap-weak-o">1.00</output></label>
            <label>Left trigger <input id="hap-left" type="range" min="0" max="1" step="0.05" value="1"><output id="hap-left-o">1.00</output></label>
            <label>Right trigger <input id="hap-right" type="range" min="0" max="1" step="0.05" value="1"><output id="hap-right-o">1.00</output></label>
            <label>Duration <input id="hap-duration" type="range" min="50" max="3000" step="50" value="400"><output id="hap-duration-o">400 ms</output></label>
            <label>Start delay <input id="hap-delay" type="range" min="0" max="1000" step="50" value="0"><output id="hap-delay-o">0 ms</output></label>
          </div>
          <div class="logbar">
            <button class="tool" id="hap-play" type="button">Play</button>
            <button class="tool quiet" id="hap-stop" type="button">Stop</button>
            <button class="tool quiet" id="hap-identify" type="button" title="A short buzz, and this controller's card flashes">Identify</button>
          </div>
          <h3 class="hap-h">Presets</h3>
          <div class="logbar" id="hap-presets"></div>
          <h3 class="hap-h">Results</h3>
          <ol id="hap-results" class="hap-results" aria-live="polite"></ol>
        </div>
        <div class="thead" id="thead">     time        gap  event</div>
        <pre id="transcript" tabindex="0" aria-label="Controller input transcript"></pre>
        <p id="note" class="muted" aria-live="polite"></p>
      </section>
    </div>
  </div>
  <script type="module" src="/controller-lab/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      addEventListener('load', () => {
        navigator.serviceWorker.register('/controller-lab/sw.js', { scope: '/controller-lab/' }).catch(() => {});
      });
    }
  </script>
</body>
</html>
