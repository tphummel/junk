<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>pounce</title>
  <style>
    :root {
      color-scheme: light dark;
      /* golden-angle seed: #2DD2AE cw */
      /* >= 4.5:1 on #FFFFFF (light) and #111111 (dark) */
      --primary: #1D856F;
      --support: #4B8074;
      --accent:  #CB2CC0;
      --bg: #FFFFFF;
      --text: #111111;
      --panel: #F1F5F4;
      --series-l: 38%;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #2DD2AE;
        --support: #5FA192;
        --accent:  #D330C7;
        --bg: #111111;
        --text: #EEEEEE;
        --panel: #1C2220;
        --series-l: 62%;
      }
    }
    * { box-sizing: border-box; }
    body { font: 16px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0 auto; max-width: 42rem; padding: 1rem 16px 4rem; }
    h1, h2 { color: var(--primary); margin: 1rem 0 .5rem; }
    h2 { font-size: 1.15rem; }
    a { color: var(--primary); }
    section { background: var(--panel); border-radius: 10px; padding: .5rem 1rem 1rem; margin: 1rem 0; }
    .muted { color: var(--support); font-weight: normal; font-size: .9rem; }
    .error { color: var(--accent); min-height: 1.4em; margin: 0; }
    .win { font-weight: bold; color: var(--accent); }
    .row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin: .5rem 0; }
    input { font: inherit; padding: .5rem; border: 1px solid var(--support); border-radius: 6px; background: var(--bg); color: var(--text); min-width: 0; }
    input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    input.narrow { width: 4.5rem; }
    label.inline { display: flex; align-items: center; gap: .4rem; }
    button, .btn { font: inherit; padding: .5rem .9rem; border: 1px solid var(--primary); border-radius: 6px; background: transparent; color: var(--primary); cursor: pointer; }
    button.primary { background: var(--primary); color: var(--bg); }
    button.big { font-size: 1.3rem; padding: .8rem 1.2rem; width: 100%; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    button.link { border: 0; padding: .2rem .4rem; text-decoration: underline; font-size: .9rem; }
    .chips { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; margin: .5rem 0; }
    .chip { border-radius: 999px; padding: .4rem .8rem; }
    .chip.in { background: var(--primary); color: var(--bg); }
    .chip b { margin-left: .3rem; }
    .timer { font-size: 4rem; font-variant-numeric: tabular-nums; text-align: center; margin: .5rem 0; }
    .who { font-weight: 600; overflow-wrap: anywhere; }
    .list { list-style: none; padding: 0; }
    .list li { padding: .3rem 0; display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
    table { border-collapse: collapse; width: 100%; font-size: .9rem; margin: .5rem 0; }
    th, td { text-align: left; padding: .3rem .4rem; border-bottom: 1px solid var(--support); }
    th { color: var(--support); font-weight: 600; }
    .chart { width: 100%; height: auto; background: var(--bg); border-radius: 6px; }
    .key i { display: inline-block; width: .8rem; height: .8rem; border-radius: 50%; margin-right: .3rem; }
    .bars { display: flex; align-items: flex-end; gap: 3px; height: 70px; }
    .bar { flex: 1; background: var(--primary); border-radius: 2px 2px 0 0; min-width: 3px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .6rem; margin: .6rem 0; }
    .card { background: var(--bg); border: 3px solid transparent; border-radius: 12px; padding: .4rem; display: flex; flex-direction: column; gap: .4rem; }
    .card.pouncer { border-color: var(--accent); }
    .card-top { display: flex; justify-content: space-between; align-items: center; gap: .3rem; }
    .card .who { font-size: 1.1rem; }
    .x { width: 2.75rem; height: 2.75rem; padding: 0; font-size: 1.5rem; line-height: 1; border-color: var(--support); color: var(--support); flex: none; }
    .wheel { height: 132px; overflow-y: scroll; scroll-snap-type: y mandatory; overscroll-behavior: contain; touch-action: pan-y; -webkit-overflow-scrolling: touch; scrollbar-width: none; position: relative;
      -webkit-mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent); mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent); }
    .wheel::-webkit-scrollbar { display: none; }
    .wheel .spacer { height: 44px; }
    .tick { height: 44px; line-height: 44px; text-align: center; font-size: 1.7rem; font-variant-numeric: tabular-nums; scroll-snap-align: center; scroll-snap-stop: always; user-select: none; -webkit-user-select: none; }
    .tick.neg { color: var(--support); }
    .wheelwrap { position: relative; }
    .band { position: absolute; left: 0; right: 0; top: 44px; height: 44px; border-block: 2px solid var(--primary); border-radius: 8px; pointer-events: none; }
    .pounce-btn { width: 100%; min-height: 2.75rem; padding: .5rem .3rem; white-space: nowrap; }
    .pounce-btn[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 700; }
    .bench-strip .chip { min-height: 2.75rem; }
    .inline-add { margin: 0; flex: 1; min-width: 12rem; }
    .inline-add input { flex: 1; min-height: 2.75rem; font-size: 1rem; }
    .savebar { position: sticky; bottom: 0; display: flex; align-items: center; gap: .6rem; padding: .6rem 0; background: var(--panel); }
    .savebar .error { flex: 1; font-size: .85rem; min-height: 0; }
    .savebar .primary { min-width: 10rem; font-size: 1.2rem; padding: .8rem 1rem; }
    details.settings { margin: .5rem 0; }
    summary { cursor: pointer; color: var(--support); }
  </style>
  <meta name="theme-color" content="#111111">
  <link rel="icon" href="/pounce/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/pounce/apple-touch-icon.png">
  <link rel="manifest" href="/pounce/manifest.webmanifest">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/pounce/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      addEventListener('load', () => {
        navigator.serviceWorker.register('/pounce/sw.js', { scope: '/pounce/' }).catch(() => {});
      });
    }
  </script>
</body>
</html>
