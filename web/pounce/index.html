<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>pounce</title>
  <style>
    :root {
      color-scheme: light dark;
      /* golden-angle seed: #2DD2AE cw */
      /* >= 4.5:1 on #FFFFFF (light) and #111111 (dark) */
      --primary: #1D856F;
      --support: #4B8074;
      --accent:  #CB2CC0;
      --bg: #FFFFFF;
      --text: #111111;
      --panel: #F1F5F4;
      --series-l: 38%;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #2DD2AE;
        --support: #5FA192;
        --accent:  #D330C7;
        --bg: #111111;
        --text: #EEEEEE;
        --panel: #1C2220;
        --series-l: 62%;
      }
    }
    * { box-sizing: border-box; }
    body { font: 16px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0 auto; max-width: 42rem; padding: 1rem 16px 4rem; }
    h1, h2 { color: var(--primary); margin: 1rem 0 .5rem; }
    h2 { font-size: 1.15rem; }
    a { color: var(--primary); }
    section { background: var(--panel); border-radius: 10px; padding: .5rem 1rem 1rem; margin: 1rem 0; }
    .muted { color: var(--support); font-weight: normal; font-size: .9rem; }
    .error { color: var(--accent); min-height: 1.4em; margin: 0; }
    .win { font-weight: bold; color: var(--accent); }
    .row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin: .5rem 0; }
    input { font: inherit; padding: .5rem; border: 1px solid var(--support); border-radius: 6px; background: var(--bg); color: var(--text); min-width: 0; }
    input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    input.narrow { width: 4.5rem; }
    label.inline { display: flex; align-items: center; gap: .4rem; }
    button, .btn { font: inherit; padding: .5rem .9rem; border: 1px solid var(--primary); border-radius: 6px; background: transparent; color: var(--primary); cursor: pointer; }
    button.primary { background: var(--primary); color: var(--bg); }
    button.big { font-size: 1.3rem; padding: .8rem 1.2rem; width: 100%; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    button.link { border: 0; padding: .2rem .4rem; text-decoration: underline; font-size: .9rem; }
    .chips { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; margin: .5rem 0; }
    .chip { border-radius: 999px; padding: .4rem .8rem; }
    .chip.in { background: var(--primary); color: var(--bg); }
    .chip b { margin-left: .3rem; }
    .timer { font-size: 4rem; font-variant-numeric: tabular-nums; text-align: center; margin: .5rem 0; }
    .entry { display: grid; grid-template-columns: 1fr 5rem auto auto auto; gap: .4rem; align-items: center; padding: .4rem 0; border-bottom: 1px solid var(--support); }
    .entry input[type=number] { width: 100%; font-size: 1.3rem; text-align: center; }
    .who { font-weight: 600; overflow-wrap: anywhere; }
    .pounce { display: flex; align-items: center; gap: .3rem; white-space: nowrap; }
    .pounce input { width: 1.4rem; height: 1.4rem; accent-color: var(--accent); }
    .list { list-style: none; padding: 0; }
    .list li { padding: .3rem 0; display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
    table { border-collapse: collapse; width: 100%; font-size: .9rem; margin: .5rem 0; }
    th, td { text-align: left; padding: .3rem .4rem; border-bottom: 1px solid var(--support); }
    th { color: var(--support); font-weight: 600; }
    .chart { width: 100%; height: auto; background: var(--bg); border-radius: 6px; }
    .key i { display: inline-block; width: .8rem; height: .8rem; border-radius: 50%; margin-right: .3rem; }
    .bars { display: flex; align-items: flex-end; gap: 3px; height: 70px; }
    .bar { flex: 1; background: var(--primary); border-radius: 2px 2px 0 0; min-width: 3px; }
    .notes { display: block; margin: .6rem 0; }
    .notes textarea { display: block; width: 100%; font: inherit; padding: .5rem; margin-top: .3rem; border: 1px solid var(--support); border-radius: 6px; background: var(--bg); color: var(--text); resize: vertical; }
    .note { white-space: pre-wrap; overflow-wrap: anywhere; margin: .3rem 0 0; }
    .namebtn { border: 0; padding: .3rem .2rem; text-align: left; color: var(--text); font-size: 1.05rem; text-decoration: underline dotted var(--support); text-underline-offset: 4px; }
    .badge { font-size: .75rem; font-weight: 600; color: var(--bg); background: var(--accent); border-radius: 999px; padding: .05rem .5rem; margin-left: .3rem; text-decoration: none; display: inline-block; }
    dialog { background: var(--bg); color: var(--text); border: 2px solid var(--primary); border-radius: 12px; padding: 1rem; width: min(92vw, 26rem); }
    dialog::backdrop { background: rgba(0, 0, 0, .55); }
    .modal label { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; margin: .6rem 0; }
    .modal label input:not(.narrow) { flex: 1; }
    details.settings { margin: .5rem 0; }
    summary { cursor: pointer; color: var(--support); }
  </style>
  <meta name="theme-color" content="#111111">
  <link rel="icon" href="/pounce/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/pounce/apple-touch-icon.png">
  <link rel="manifest" href="/pounce/manifest.webmanifest">
</head>
<body>
  <div id="app"></div>
  <p class="muted"><small id="version">2026-11-26T21:17:44Z</small></p>
  <script type="module" src="/pounce/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      addEventListener('load', () => {
        navigator.serviceWorker.register('/pounce/sw.js', { scope: '/pounce/' }).catch(() => {});
      });
    }
  </script>
</body>
</html>
