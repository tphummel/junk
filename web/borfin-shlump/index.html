<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tom Hummel :: Borfin Shlump</title>
  <meta name="description" content="Keep the Borfin unshlumped. It shlumps itself every morning at 6.">
  <meta name="theme-color" content="#2D74D2">
  <style>
    :root {
      color-scheme: light dark;
      /* golden-angle seed: #2D74D2 cw */
      /* >= 4.5:1 on #FFFFFF (light) and #111111 (dark) */
      --primary: #2D74D2;
      --support: #5D789E;
      --accent:  #D22D44;
      --bg: #FFFFFF;
      --text: #111111;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #397CD4;
        --support: #627EA3;
        --accent:  #D8495C;
        --bg: #111111;
        --text: #EEEEEE;
      }
    }
    body {
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 40rem;
      margin: 0 auto;
      padding: 1rem;
    }
    #error { color: var(--accent); white-space: pre-wrap; }
  </style>
</head>
<body>
  <div id="app"></div>
  <pre id="error"></pre>
  <script type="module">
    import { compile } from 'https://cdn.jsdelivr.net/npm/svelte@3.59.2/compiler.mjs';

    async function main() {
      try {
        const res = await fetch('App.svelte');
        if (!res.ok) throw new Error(`failed to load App.svelte: ${res.status}`);
        const source = await res.text();

        const { js, css } = compile(source, { generate: 'dom', format: 'esm', name: 'App' });

        if (css.code) {
          const style = document.createElement('style');
          style.textContent = css.code;
          document.head.appendChild(style);
        }

        const runtimeUrl = 'https://cdn.jsdelivr.net/npm/svelte@3.59.2/internal/index.mjs';
        const transformed = js.code.replace('from "svelte/internal"', `from '${runtimeUrl}'`);
        const blob = new Blob([transformed], { type: 'application/javascript' });
        const url = URL.createObjectURL(blob);
        const { default: App } = await import(url);
        URL.revokeObjectURL(url);
        new App({ target: document.getElementById('app') });
      } catch (err) {
        const pre = document.getElementById('error');
        pre.textContent = err.stack || err;
        console.error(err);
      }
    }
    main();
  </script>
</body>
</html>
