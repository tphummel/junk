<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Tom Hummel :: MLB Scoreboard</title>
  <style>
    :root {
      color-scheme: light dark;
      /* golden-angle seed: #1300DF cw */
      /* >= 4.5:1 on #FFFFFF (light) and #111111 (dark) */
      --primary: #1300DF;
      --support: #4A439C;
      --accent:  #CD4D00;
      --bg: #FFFFFF;
      --text: #111111;
      --muted: #595959;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #7265FF;
        --support: #7972C3;
        --accent:  #DF5400;
        --bg: #111111;
        --text: #EEEEEE;
        --muted: #A3A3A3;
      }
    }
    body { background: var(--bg); color: var(--text); }
  </style>
  <meta name="theme-color" content="#111111">
  <link rel="icon" href="/mlb-scoreboard/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/mlb-scoreboard/apple-touch-icon.png">
  <link rel="manifest" href="/mlb-scoreboard/manifest.webmanifest">
  <script type="importmap">
  {
    "imports": {
      "svelte":          "https://cdn.jsdelivr.net/npm/svelte@3.59.2/index.mjs",
      "svelte/internal": "https://cdn.jsdelivr.net/npm/svelte@3.59.2/internal/index.mjs"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <script>
    function log(msg) {
      let pre = document.getElementById('log');
      if (!pre) {
        pre = document.createElement('pre');
        pre.id = 'log';
        pre.style.color = 'var(--accent)';
        pre.style.whiteSpace = 'pre-wrap';
        document.body.appendChild(pre);
      }
      pre.textContent += (pre.textContent ? '\n' : '') + msg;
    }

    window.addEventListener('error', (e) => {
      // cross-origin errors (extensions, injected scripts) are opaque and not from this page
      if (e.message === 'Script error.' && !e.filename && !e.error) return;
      log(e.error?.stack || e.message);
    });
    window.addEventListener('unhandledrejection', (e) => {
      const r = e.reason;
      if (r) log(r instanceof Error ? (r.stack || r.message) : String(r));
    });
  </script>
  <script type="module">
    import { compile } from 'https://cdn.jsdelivr.net/npm/svelte@3.59.2/compiler.mjs';

    async function main() {
      try {
        const res = await fetch('App.svelte');
        if (!res.ok) throw new Error(`failed to load App.svelte: ${res.status}`);
        const source = await res.text();

        const { js, css } = compile(source, { generate: 'dom', format: 'esm', name: 'App' });

        if (css.code) {
          const style = document.createElement('style');
          style.textContent = css.code;
          document.head.appendChild(style);
        }

        const blob = new Blob([js.code], { type: 'text/javascript' });
        const blobUrl = URL.createObjectURL(blob);
        const { default: App } = await import(blobUrl);
        new App({ target: document.getElementById('app') });
      } catch (err) {
        log(err instanceof Error ? (err.stack || err.message) : String(err));
        console.error(err);
      }
    }
    main();
  </script>
</body>
</html>
