<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Metroid 3</title>
  <meta name="description" content="Browser-only Super Metroid 100% checklist tracker and journal.">
  <link rel="stylesheet" href="style.css">
  <style id="page-style"></style>
</head>
<body class="m3">
  <header class="app-header no-print">
    <div class="app-header-inner">
      <a class="brand" href="#/">Metroid 3<small>Super Metroid 100% tracker</small></a>
      <span class="game-title" id="game-title" hidden></span>
      <nav class="tabs" id="tabs" aria-label="Main"></nav>
    </div>
  </header>
  <main id="app"><p class="muted">Loading…</p></main>
  <dialog id="dlg"></dialog>
  <input type="file" id="file-input" class="visually-hidden" multiple tabindex="-1" aria-hidden="true" accept=".json,.csv,.html,.htm,.txt,application/json,text/csv,text/html,text/plain">
  <noscript><p style="padding:1rem">Metroid 3 needs JavaScript. Everything is stored in your browser; nothing is sent anywhere.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
