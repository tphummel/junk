<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>HTTP Rocket</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-title" content="HTTP Rocket">
  <style>
    :root {
      color-scheme: light dark;
      /* golden-angle seed: #D22DD0 cw */
      /* >= 4.5:1 on #FFFFFF (light) and #111111 (dark) */
      --primary: #C92BC8;
      --support: #A15FA0;
      --accent: #62801C;
      --bg: #FFFFFF;
      --text: #111111;
      --panel: #F6F4F6;
      --muted: #5A505A;
      --error: #B3261E;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #D22DD0;
        --support: #A566A4;
        --accent: #A0D22D;
        --bg: #111111;
        --text: #EEEEEE;
        --panel: #1C1B1C;
        --muted: #B8B0B8;
        --error: #FF8A80;
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, sans-serif; }
    h1, h2, h3 { color: var(--primary); margin: 0; }
    h1 { font-size: 1.25rem; }
    h2 { font-size: 1rem; }
    .muted { color: var(--muted); }
    .error { color: var(--error); }
    a { color: var(--primary); }
    button, select, input, textarea {
      font: inherit; color: var(--text); background: var(--bg);
      border: 1px solid var(--support); border-radius: 4px; padding: 0.3rem 0.6rem;
    }
    button { cursor: pointer; }
    button.primary { background: var(--primary); color: var(--bg); border-color: var(--primary); font-weight: 600; }
    button.link { border: 0; background: none; color: var(--primary); padding: 0.2rem 0.4rem; }
    button:disabled { opacity: 0.6; cursor: default; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    textarea, input.mono, pre { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }

    header.top { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; padding: 0.6rem 1rem; border-bottom: 1px solid var(--support); }
    header.top .spacer { flex: 1; }
    nav.views button[aria-pressed="true"] { background: var(--panel); border-color: var(--primary); }
    .layout { display: grid; grid-template-columns: 300px 1fr; min-height: calc(100vh - 3.2rem); }
    aside { border-right: 1px solid var(--support); padding: 0.75rem; background: var(--panel); overflow: auto; }
    aside .actions { display: flex; gap: 0.4rem; margin-bottom: 0.75rem; flex-wrap: wrap; }
    main { padding: 1rem; min-width: 0; }
    @media (max-width: 800px) {
      .layout { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--support); max-height: 40vh; }
    }

    ul.tree, ul.tree ul { list-style: none; margin: 0; padding: 0; }
    ul.tree ul { padding-left: 1rem; }
    .row { display: flex; align-items: center; gap: 0.25rem; border-radius: 4px; }
    .row > button.item { flex: 1; text-align: left; border: 0; background: none; padding: 0.3rem 0.4rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row.selected { background: var(--bg); outline: 1px solid var(--primary); }
    .method { display: inline-block; min-width: 3.4rem; font: 700 11px ui-monospace, monospace; color: var(--muted); }
    .empty { padding: 0.5rem; }

    .bar { display: flex; gap: 0.5rem; margin: 0.75rem 0; }
    .bar input.url { flex: 1; min-width: 0; }
    .field { display: flex; flex-direction: column; gap: 0.2rem; margin: 0.5rem 0; }
    .tabs { display: flex; gap: 0.25rem; border-bottom: 1px solid var(--support); margin-top: 0.5rem; }
    .tabs button { border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: none; }
    .tabs button[aria-selected="true"] { border-bottom-color: var(--primary); font-weight: 600; }
    .tabpanel { padding: 0.5rem 0; }
    .kv { display: grid; grid-template-columns: auto 1fr 1fr auto; gap: 0.4rem; align-items: center; margin-bottom: 0.4rem; }
    .kv input[type="text"] { min-width: 0; }
    textarea.body { width: 100%; min-height: 10rem; resize: vertical; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }

    .response { margin-top: 1rem; border: 1px solid var(--support); border-radius: 6px; padding: 0.75rem; background: var(--panel); }
    .response .meta { display: flex; gap: 1rem; flex-wrap: wrap; margin: 0.4rem 0; }
    pre { margin: 0.4rem 0 0; padding: 0.6rem; background: var(--bg); border: 1px solid var(--support); border-radius: 4px; overflow: auto; max-height: 28rem; white-space: pre-wrap; word-break: break-word; }
    details > summary { cursor: pointer; color: var(--primary); }

    table.audit { width: 100%; border-collapse: collapse; }
    table.audit th, table.audit td { text-align: left; padding: 0.35rem 0.5rem; border-bottom: 1px solid var(--support); vertical-align: top; }
    table.audit td.url { word-break: break-all; }
    .sr { position: absolute; left: -9999px; }
  </style>
</head>
<body>
  <header class="top">
    <h1>🚀 HTTP Rocket</h1>
    <nav class="views" aria-label="Views">
      <button type="button" id="view-requests" aria-pressed="true">Requests</button>
      <button type="button" id="view-audit" aria-pressed="false">Audit log</button>
    </nav>
    <span class="spacer"></span>
    <span id="status" class="muted" role="status" aria-live="polite"></span>
    <button type="button" id="import">Import…</button>
    <button type="button" id="export">Export</button>
    <input type="file" id="import-file" accept="application/json,.json" class="sr" tabindex="-1" aria-label="Import file">
  </header>

  <div class="layout" id="requests-view">
    <aside aria-label="Saved requests">
      <div class="actions">
        <button type="button" id="new-request" class="primary">+ Request</button>
        <button type="button" id="new-folder">+ Folder</button>
      </div>
      <div id="tree"></div>
    </aside>
    <main id="editor"></main>
  </div>

  <main id="audit-view" hidden></main>

  <script type="module" src="./app.js"></script>
</body>
</html>
