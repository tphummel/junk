<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>gif maker</title>
  <style>
    :root {
      color-scheme: light dark;
      /* golden-angle seed: #2DB4D2 cw */
      /* >= 4.5:1 on #FFFFFF (light) and #111111 (dark) */
      --primary: #208197;
      --support: #507D88;
      --accent:  #D22D84;
      --bg: #FFFFFF;
      --text: #111111;
      --panel: #F1F6F7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #2DB4D2;
        --support: #5F95A1;
        --accent:  #D6418F;
        --bg: #111111;
        --text: #EEEEEE;
        --panel: #1B2326;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0 auto; padding: 1rem; max-width: 46rem; background: var(--bg); color: var(--text); font: 1rem/1.5 system-ui, sans-serif; }
    h1, h2 { color: var(--primary); margin: 0 0 .5rem; }
    h1 { font-size: 1.6rem; }
    h2 { font-size: 1.1rem; }
    .muted { color: var(--support); }
    section { margin: 1.25rem 0; }
    button, .btn { font: inherit; background: var(--primary); color: var(--bg); border: 0; border-radius: .4rem; padding: .5rem 1rem; cursor: pointer; text-decoration: none; display: inline-block; }
    button.secondary { background: none; color: var(--primary); border: 2px solid var(--primary); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    #drop { display: block; border: 2px dashed var(--support); border-radius: .6rem; padding: 2rem 1rem; text-align: center; cursor: pointer; }
    #drop.over { border-color: var(--accent); background: var(--panel); }
    #drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    #drop:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }

    #video { display: block; width: 100%; max-height: 60vh; background: #000; border-radius: .4rem; }

    .range { position: relative; height: 2.5rem; margin: .75rem 0 .25rem; }
    .range .track, .range .sel { position: absolute; top: 50%; height: .5rem; margin-top: -.25rem; border-radius: .25rem; }
    .range .track { left: 0; right: 0; background: var(--panel); border: 1px solid var(--support); }
    .range .sel { background: var(--primary); }
    .range .head { position: absolute; top: 20%; bottom: 20%; width: 2px; background: var(--accent); pointer-events: none; }
    .range input { position: absolute; inset: 0; width: 100%; margin: 0; background: none; appearance: none; -webkit-appearance: none; pointer-events: none; }
    .range input::-webkit-slider-runnable-track { background: none; height: 2.5rem; }
    .range input::-moz-range-track { background: none; height: 2.5rem; }
    .range input::-webkit-slider-thumb { -webkit-appearance: none; pointer-events: auto; cursor: ew-resize; width: 1.1rem; height: 2rem; margin-top: .25rem; border-radius: .3rem; background: var(--primary); border: 2px solid var(--bg); box-shadow: 0 0 0 1px var(--primary); }
    .range input::-moz-range-thumb { pointer-events: auto; cursor: ew-resize; width: .9rem; height: 1.8rem; border-radius: .3rem; background: var(--primary); border: 2px solid var(--bg); box-shadow: 0 0 0 1px var(--primary); }
    .times { display: flex; justify-content: space-between; gap: .5rem; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
    .row { display: flex; gap: .5rem; flex-wrap: wrap; margin: .75rem 0; }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: .75rem 1rem; }
    .grid label { display: grid; gap: .2rem; }
    .grid input, .grid select { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--support); border-radius: .3rem; padding: .3rem .4rem; width: 100%; }
    .grid input[type=range] { padding: 0; accent-color: var(--primary); }
    progress { width: 100%; accent-color: var(--primary); }
    #result img { max-width: 100%; border-radius: .4rem; background: var(--panel); }
    #err { color: var(--accent); font-weight: 600; }
    [hidden] { display: none !important; }
    small#version { display: block; margin-top: 2rem; color: var(--support); }
  </style>
  <meta name="theme-color" content="#111111">
  <link rel="icon" href="/gif-maker/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/gif-maker/apple-touch-icon.png">
  <link rel="manifest" href="/gif-maker/manifest.webmanifest">
</head>
<body>
  <h1>gif maker</h1>
  <p class="muted">Turn part of a video into a GIF. Everything happens in your browser; the video never leaves your device.</p>

  <section>
    <label id="drop">
      <input id="file" type="file" accept="video/*">
      <strong>Choose a video</strong> or drop one here
      <div class="muted" id="fileName">MP4, WebM, MOV, whatever your browser can play</div>
    </label>
    <p id="err" role="alert" hidden></p>
  </section>

  <div id="editor" hidden>
    <section>
      <h2>Trim</h2>
      <video id="video" muted playsinline preload="auto"></video>
      <div class="range" id="range">
        <div class="track"></div>
        <div class="sel" id="sel"></div>
        <div class="head" id="head"></div>
        <input id="start" type="range" min="0" max="1" step="0.01" value="0" aria-label="Start time">
        <input id="end" type="range" min="0" max="1" step="0.01" value="1" aria-label="Finish time">
      </div>
      <div class="times">
        <span>Start <b id="startT">0.00s</b></span>
        <span>Length <b id="lenT">0.00s</b></span>
        <span>Finish <b id="endT">0.00s</b></span>
      </div>
      <div class="row">
        <button type="button" id="play" class="secondary">Play selection</button>
      </div>
    </section>

    <section>
      <h2>Settings</h2>
      <div class="grid">
        <label><span>Frame rate: <span id="fpsO">12</span> fps</span>
          <input id="fps" type="range" min="1" max="30" step="1" value="12">
        </label>
        <label>Width (px)
          <input id="width" type="number" min="16" max="1920" step="1" value="480" inputmode="numeric">
        </label>
        <label>Speed
          <select id="speed">
            <option value="0.25">0.25x</option>
            <option value="0.5">0.5x</option>
            <option value="1" selected>1x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2x</option>
            <option value="4">4x</option>
          </select>
        </label>
        <label>Direction
          <select id="direction">
            <option value="forward" selected>Forward</option>
            <option value="reverse">Reverse</option>
            <option value="boomerang">Boomerang (forward then back)</option>
          </select>
        </label>
        <label>Loop
          <select id="loop">
            <option value="forever" selected>Forever</option>
            <option value="once">Play once</option>
          </select>
        </label>
        <label>Colors
          <select id="colors">
            <option value="256" selected>256 (best quality)</option>
            <option value="128">128</option>
            <option value="64">64</option>
            <option value="32">32</option>
            <option value="16">16 (smallest)</option>
          </select>
        </label>
      </div>
      <p class="muted" id="summary" aria-live="polite"></p>
    </section>

    <section>
      <div class="row">
        <button type="button" id="make">Make GIF</button>
        <button type="button" id="cancel" class="secondary" hidden>Cancel</button>
      </div>
      <progress id="progress" value="0" max="1" hidden></progress>
      <p class="muted" id="status" aria-live="polite"></p>
    </section>

    <section id="result" hidden>
      <h2>Result</h2>
      <img id="out" alt="Generated GIF">
      <p><span id="outInfo" class="muted"></span></p>
      <a class="btn" id="download" download="clip.gif">Download GIF</a>
    </section>
  </div>

  <small id="version">2026-11-27T07:00:29Z</small>
  <script type="module" src="/gif-maker/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      addEventListener('load', () => {
        navigator.serviceWorker.register('/gif-maker/sw.js', { scope: '/gif-maker/' }).catch(() => {});
      });
    }
  </script>
</body>
</html>
