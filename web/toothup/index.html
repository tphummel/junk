<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>toothup</title>
  <style>
    :root {
      color-scheme: light dark;
      /* golden-angle seed: #722DD2 cw */
      /* >= 4.5:1 on #FFFFFF (light) and #111111 (dark) */
      --primary: #722DD2;
      --support: #7A5FA1;
      --accent:  #937120;
      --bg: #FFFFFF;
      --text: #111111;
      --on-primary: #FFFFFF;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #9561DD;
        --support: #8971AB;
        --accent:  #D2A22D;
        --bg: #111111;
        --text: #EEEEEE;
        --on-primary: #111111;
      }
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 1rem/1.5 system-ui, sans-serif;
      max-width: 30rem;
      margin: 0 auto;
      padding: 1rem;
      padding-bottom: calc(1rem + env(safe-area-inset-bottom));
    }
    h1, h2 { color: var(--primary); margin: 0 0 .5rem; }
    h1 { font-size: 1.5rem; }
    h2 { font-size: 1.1rem; }
    .muted { color: var(--support); }
    [hidden] { display: none !important; }
    nav { display: flex; gap: .5rem; margin: .5rem 0 1rem; }
    nav button { flex: 1; background: none; color: var(--primary); border: 2px solid var(--support); }
    nav button[aria-selected="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
    button, select {
      font: inherit; padding: .6rem 1rem; border-radius: .5rem; border: 2px solid var(--primary);
      background: var(--primary); color: var(--on-primary); cursor: pointer; min-height: 2.75rem;
    }
    button.secondary, select { background: none; color: var(--primary); }
    button.link { background: none; border: 0; padding: 0 .25rem; min-height: 0; color: var(--primary); text-decoration: underline; }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }

    #clock { font-size: 5rem; font-weight: 700; line-height: 1; text-align: center; font-variant-numeric: tabular-nums; color: var(--primary); }
    #quad-name { text-align: center; font-size: 1.5rem; margin-top: .5rem; }
    #progress { text-align: center; margin-bottom: 1rem; }
    #mouth { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin: 0 auto 1rem; max-width: 18rem; }
    #mouth div { border: 2px solid var(--support); border-radius: .75rem; padding: 1rem .25rem; text-align: center; color: var(--support); }
    #mouth div.done { border-style: solid; background: var(--support); color: var(--bg); }
    #mouth div.active { border-color: var(--accent); border-width: 4px; background: var(--primary); color: var(--on-primary); font-weight: 700; }
    .controls { display: flex; gap: .5rem; justify-content: center; flex-wrap: wrap; margin-bottom: 1rem; }
    #go { min-width: 9rem; font-weight: 700; }
    label.check { display: flex; gap: .75rem; align-items: center; justify-content: center; font-size: 1.1rem; margin: 1rem 0; }
    label.check input { width: 1.5rem; height: 1.5rem; accent-color: var(--primary); }

    #tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; margin-bottom: 1rem; }
    .tile { border: 1px solid var(--support); border-radius: .5rem; padding: .5rem; text-align: center; }
    .tile .k, .tile .u { font-size: .75rem; color: var(--support); }
    .tile .v { font-size: 1.5rem; font-weight: 700; color: var(--primary); }
    .cal-head { display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin-bottom: .5rem; }
    .cal-head strong { flex: 1; text-align: center; }
    table { width: 100%; border-collapse: separate; border-spacing: 2px; table-layout: fixed; }
    th { font-size: .75rem; color: var(--support); font-weight: 400; }
    td { padding: 0; }
    .day { width: 100%; aspect-ratio: 1; min-height: 0; padding: 0; position: relative; background: none; color: var(--text); border: 1px solid var(--support); border-radius: .4rem; font-size: .9rem; }
    .day.l1 { background: var(--support); color: var(--bg); }
    .day.l2 { background: var(--primary); color: var(--on-primary); }
    .day.today { border-width: 2px; border-color: var(--accent); }
    .day.sel { outline: 3px solid var(--text); outline-offset: 1px; }
    .day .mark { position: absolute; right: 3px; bottom: 0; font-size: .7rem; }
    .legend { font-size: .8rem; color: var(--support); margin: .5rem 0 1rem; }
    #day-list { padding-left: 1.25rem; }
    #toast { min-height: 1.5rem; margin-top: 1rem; color: var(--accent); font-weight: 600; }
    .box { border: 1px solid var(--support); border-radius: .5rem; padding: .75rem 1rem; margin-bottom: 1rem; }
  </style>
  <meta name="theme-color" content="#111111">
  <link rel="icon" href="/toothup/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/toothup/apple-touch-icon.png">
  <link rel="manifest" href="/toothup/manifest.webmanifest">
</head>
<body>
  <h1>🦷 toothup</h1>
  <nav aria-label="Sections">
    <button id="tab-brush" aria-selected="true">Brush</button>
    <button id="tab-stats" aria-selected="false">Stats</button>
    <button id="tab-data" aria-selected="false">Data</button>
  </nav>

  <main>
    <section id="view-brush">
      <div id="clock" role="timer" aria-live="off">0:30</div>
      <div id="quad-name">Ready</div>
      <div id="progress" class="muted"></div>
      <div id="mouth" aria-label="Mouth quadrants, as seen in a mirror">
        <div data-q="0">Upper right</div><div data-q="1">Upper left</div>
        <div data-q="3">Lower right</div><div data-q="2">Lower left</div>
      </div>
      <div class="controls">
        <button id="go">Start</button>
        <button id="skip" class="secondary" hidden>Skip</button>
        <button id="stop" class="secondary" hidden>Finish</button>
        <button id="reset" class="secondary" hidden>Reset</button>
      </div>
      <label class="check"><input type="checkbox" id="floss"> Flossed</label>
      <div class="row" style="justify-content:center">
        <label class="muted" for="per-quad">Seconds per quadrant</label>
        <select id="per-quad">
          <option>15</option><option>20</option><option selected>30</option><option>45</option><option>60</option>
        </select>
      </div>
    </section>

    <section id="view-stats" hidden>
      <div id="tiles"></div>
      <div class="cal-head">
        <button id="prev" class="secondary" aria-label="Previous month">‹</button>
        <strong id="month-label"></strong>
        <button id="next" class="secondary" aria-label="Next month">›</button>
      </div>
      <table>
        <thead><tr><th>Su</th><th>Mo</th><th>Tu</th><th>We</th><th>Th</th><th>Fr</th><th>Sa</th></tr></thead>
        <tbody id="cal-body"></tbody>
      </table>
      <p class="legend">Muted fill: 1 brush · Solid fill: 2+ · ✦ flossed · <button id="this-month" class="link">today</button></p>
      <h2 id="day-title"></h2>
      <ul id="day-list"></ul>
      <button id="log-manual" class="secondary">Log a brushing without the timer</button>
    </section>

    <section id="view-data" hidden>
      <div class="box">
        <h2>Your data</h2>
        <p id="count" class="muted"></p>
        <p>Everything stays on this device. Export a JSON backup, or import one to merge it in (matching entries are not duplicated).</p>
        <div class="row">
          <button id="export">Export JSON</button>
          <input type="file" id="import" accept="application/json,.json" hidden>
          <button class="secondary" id="import-btn">Import JSON</button>
        </div>
      </div>
      <div class="box">
        <h2>Danger zone</h2>
        <button id="clear" class="secondary">Delete all history</button>
      </div>
    </section>
  </main>
  <div id="toast" role="status"></div>

  <script type="module" src="/toothup/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      addEventListener('load', () => {
        navigator.serviceWorker.register('/toothup/sw.js', { scope: '/toothup/' }).catch(() => {});
      });
    }
  </script>
</body>
</html>
