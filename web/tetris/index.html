<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Tetris</title>
  <style>
    :root {
      color-scheme: light dark;
      /* golden-angle seed: #2DD277 cw */
      /* >= 4.5:1 on #FFFFFF (light) and #111111 (dark) */
      --primary: #1D874D;
      --support: #4C8164;
      --accent:  #A72DD2;
      --bg: #FFFFFF;
      --text: #111111;
      /* Hand-chosen neutrals for the scene: a savanna by day, dusk in dark mode. */
      --sky-top: #7EC0EE;
      --sky-bottom: #F3D9A4;
      --mountain: #A9876B;
      --sand: #D9B77E;
      --sand-dark: #B8935A;
      --brick: #B9714B;
      --brick-dark: #8E5233;
      --brick-light: #CC8A62;
      --wood: #5B3A21;
      --wood-dark: #2A1A0E;
      --cream: #F7E9CF;
      --board: #2A3440;
      --grid: #323E4B;
      --mini: clamp(64px, 14vw, 110px);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #2DD277;
        --support: #5FA17C;
        --accent:  #B54DD9;
        --bg: #111111;
        --text: #EEEEEE;
        --sky-top: #141B3D;
        --sky-bottom: #8A4B3F;
        --mountain: #3B2A33;
        --sand: #6B5636;
        --sand-dark: #4A3B25;
        --brick: #764530;
        --brick-dark: #4F2D1D;
        --brick-light: #8A553C;
        --wood: #3A2414;
        --wood-dark: #170E07;
        --cream: #F0E0C4;
        --board: #1B222B;
        --grid: #232C36;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--text); font-family: system-ui, sans-serif; background: var(--sand); }
    .scene {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: linear-gradient(to bottom, var(--sky-top) 0, var(--sky-bottom) 64%, var(--sand) 64%, var(--sand-dark) 100%);
    }
    /* A distant volcano on the horizon. */
    .scene::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 36%;
      width: min(90vw, 900px);
      height: 26vh;
      transform: translateX(-30%);
      background: var(--mountain);
      clip-path: polygon(0 100%, 38% 18%, 44% 12%, 52% 12%, 58% 20%, 100% 100%);
      opacity: 0.8;
    }
    .frame {
      position: relative;
      display: flex;
      gap: 10px;
      align-items: stretch;
      padding: 22px 12px 14px;
    }
    /* Wooden lintel across the top, resting on both towers. */
    .beam {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 18px;
      border-radius: 9px;
      background:
        repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.14) 0 2px, transparent 2px 11px),
        linear-gradient(to bottom, var(--wood), var(--wood-dark));
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.3);
    }
    /* A mound of sand under the whole frame. */
    .frame::after {
      content: "";
      position: absolute;
      left: -4%;
      right: -4%;
      bottom: -10px;
      height: 26px;
      border-radius: 50%;
      background: var(--sand-dark);
      z-index: -1;
    }
    .tower {
      position: relative;
      width: calc(var(--mini) + 28px);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-radius: 10px 10px 4px 4px;
      border-top: 6px solid var(--brick-light);
      background:
        repeating-linear-gradient(0deg, transparent 0 26px, rgba(0, 0, 0, 0.2) 26px 28px),
        linear-gradient(90deg, rgba(0, 0, 0, 0.28), transparent 20%, transparent 80%, rgba(255, 255, 255, 0.12)),
        var(--brick);
      box-shadow: inset 0 0 0 2px var(--brick-dark);
    }
    /* Wooden pole stubs sticking out of the outer side of each tower. */
    .tower::before {
      content: "";
      position: absolute;
      top: 20px;
      bottom: 12px;
      width: 12px;
      background: repeating-linear-gradient(0deg, var(--wood) 0 7px, transparent 7px 38px);
    }
    .tower.left::before { left: -10px; border-radius: 3px 0 0 3px; }
    .tower.right::before { right: -10px; border-radius: 0 3px 3px 0; }
    .plaque {
      margin: 0;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--wood);
      color: var(--cream);
      font-size: 0.75rem;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .mini {
      width: var(--mini);
      height: calc(var(--mini) * 0.75);
      display: block;
      border: 4px solid var(--wood);
      border-radius: 6px;
      background: var(--board);
      box-shadow: inset 0 0 8px #000;
    }
    .field { position: relative; }
    #board {
      display: block;
      height: min(80vh, calc((100vw - 2 * var(--mini) - 150px) * 2));
      aspect-ratio: 1 / 2;
      border: 6px solid var(--wood);
      border-radius: 4px;
      box-shadow: inset 0 0 12px #000, 0 0 0 2px var(--wood-dark);
    }
    /* Wooden plank with the score, like the lines sign in the original. */
    .sign {
      margin: auto 0 0;
      padding: 8px 10px;
      border: 3px solid var(--wood-dark);
      border-radius: 6px;
      color: var(--cream);
      background:
        repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.14) 0 2px, transparent 2px 9px),
        var(--wood);
    }
    dt { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; }
    dd { margin: 0 0 6px; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
    dd:last-child { margin-bottom: 0; }
    #overlay {
      position: absolute;
      inset: 6px;
      display: grid;
      place-content: center;
      gap: 8px;
      padding: 16px;
      text-align: center;
      background: color-mix(in srgb, var(--bg) 90%, transparent);
    }
    #overlay[hidden] { display: none; }
    #overlay-title { margin: 0; font-size: 1.8rem; color: var(--primary); }
    #overlay-text { margin: 0; white-space: pre-line; font-size: 0.95rem; }
  </style>
  <meta name="theme-color" content="#111111">
  <link rel="icon" href="/tetris/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/tetris/apple-touch-icon.png">
  <link rel="manifest" href="/tetris/manifest.webmanifest">
</head>
<body>
  <main class="scene">
    <div class="frame">
      <div class="beam" aria-hidden="true"></div>
      <aside class="tower left">
        <h2 class="plaque">Hold</h2>
        <canvas id="hold" class="mini" aria-label="Held piece"></canvas>
      </aside>
      <div class="field">
        <canvas id="board" aria-label="Tetris board"></canvas>
        <div id="overlay">
          <h1 id="overlay-title">Tetris</h1>
          <p id="overlay-text"></p>
        </div>
      </div>
      <aside class="tower right">
        <h2 class="plaque">Next</h2>
        <canvas id="next0" class="mini" aria-label="Next piece"></canvas>
        <canvas id="next1" class="mini" aria-label="Second next piece"></canvas>
        <canvas id="next2" class="mini" aria-label="Third next piece"></canvas>
        <dl class="sign">
          <dt>Score</dt><dd id="score">0</dd>
          <dt>Level</dt><dd id="level">1</dd>
          <dt>Lines</dt><dd id="lines">0</dd>
        </dl>
      </aside>
    </div>
  </main>
  <script type="module" src="/tetris/src/main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      addEventListener('load', () => {
        navigator.serviceWorker.register('/tetris/sw.js', { scope: '/tetris/' }).catch(() => {});
      });
    }
  </script>
</body>
</html>
