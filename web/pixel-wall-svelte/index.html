<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Tom Hummel :: Pixel Wall</title>
  <meta name="description" content="A 16x16 wall of shared counters. Click a pixel to bump it and change its color.">
  <meta name="theme-color" content="#111111">
  <link rel="icon" href="/pixel-wall-svelte/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/pixel-wall-svelte/apple-touch-icon.png">
  <link rel="manifest" href="/pixel-wall-svelte/manifest.webmanifest">
  <style>
    :root {
      color-scheme: light dark;
      /* golden-angle seed: #D22D7D cw */
      /* >= 4.5:1 on #FFFFFF (light) and #111111 (dark) */
      --primary: #D22D7D;
      --support: #A15F7F;
      --accent:  #32871D;
      --bg: #FFFFFF;
      --text: #111111;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #D6428A;
        --support: #A76987;
        --accent:  #4DD22D;
        --bg: #111111;
        --text: #EEEEEE;
      }
    }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 1rem; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "svelte/internal": "https://cdn.jsdelivr.net/npm/svelte@3.59.2/internal/index.mjs"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <script>
    function log(msg) {
      let pre = document.getElementById('log');
      if (!pre) {
        pre = document.createElement('pre');
        pre.id = 'log';
        pre.style.color = 'var(--primary)';
        pre.style.whiteSpace = 'pre-wrap';
        document.body.appendChild(pre);
      }
      pre.textContent += (pre.textContent ? '\n' : '') + msg;
    }

    window.addEventListener('error', (e) => {
      // cross-origin errors (extensions, injected scripts) are opaque and not from this page
      if (e.message === 'Script error.' && !e.filename && !e.error) return;
      log(e.error?.stack || e.message);
    });
    window.addEventListener('unhandledrejection', (e) => log(e.reason?.stack || e.reason));
  </script>
  <script type="module">
    import { compile } from 'https://cdn.jsdelivr.net/npm/svelte@3.59.2/compiler.mjs';

    async function main() {
      try {
        const res = await fetch('App.svelte');
        if (!res.ok) throw new Error(`failed to load App.svelte: ${res.status}`);
        const source = await res.text();

        const { js, css } = compile(source, { generate: 'dom', format: 'esm', name: 'App' });

        if (css.code) {
          const style = document.createElement('style');
          style.textContent = css.code;
          document.head.appendChild(style);
        }

        const { default: App } = await import(`data:text/javascript,${encodeURIComponent(js.code)}`);
        new App({ target: document.getElementById('app') });
      } catch (err) {
        log(err.stack || err);
        console.error(err);
      }
    }
    main();
  </script>
</body>
</html>
