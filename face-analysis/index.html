<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Face Analysis</title>
<style>
:root {
  color-scheme: light dark;
  /* golden-angle seed: #2DD272 cw */
  /* >= 4.5:1 on #FFFFFF (light) and #111111 (dark) */
  --primary: #1D874A;
  --support: #4C8162;
  --accent:  #A22DD2;
  --bg: #FFFFFF;
  --surface: #F3F6F4;
  --text: #111111;
  --danger: #B3261E;
}
@media (prefers-color-scheme: dark) {
  :root {
    --primary: #2DD272;
    --support: #5FA17A;
    --accent:  #B150D9;
    --bg: #111111;
    --surface: #1B211D;
    --text: #EEEEEE;
    --danger: #FF8A80;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 0 16px 48px;
  background: var(--bg); color: var(--text);
  font: 16px/1.5 system-ui, sans-serif;
}
main { max-width: 860px; margin: 0 auto; }
h1, h2 { color: var(--primary); line-height: 1.2; }
h1 { margin: 32px 0 4px; }
h2 { margin: 28px 0 10px; font-size: 1.15rem; }
.muted { color: var(--support); margin: 0; }
#drop {
  display: block; margin-top: 20px; padding: 28px 16px; text-align: center; cursor: pointer;
  border: 2px dashed var(--support); border-radius: 12px; background: var(--surface);
}
#drop.over, #drop:focus-within { border-color: var(--accent); outline: 2px solid var(--accent); }
#drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
#preview { display: none; max-width: 100%; max-height: 280px; margin: 12px auto 0; border-radius: 8px; }
.actions { display: flex; gap: 12px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
button {
  background: var(--primary); color: var(--bg); border: 0; border-radius: 8px;
  padding: 10px 22px; font: inherit; font-weight: 600; cursor: pointer;
}
button:disabled { opacity: .5; cursor: not-allowed; }
button.secondary { background: none; color: var(--primary); border: 2px solid var(--primary); }
#status { min-height: 1.5em; }
#status.error { color: var(--danger); }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.card { background: var(--surface); border-radius: 10px; padding: 12px 14px; }
.card .label { color: var(--support); font-size: .85rem; }
.card .value { font-size: 1.4rem; font-weight: 700; overflow-wrap: anywhere; }
.images { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.images img { width: 100%; max-height: 360px; object-fit: contain; border-radius: 10px; background: var(--surface); }
.images figcaption { color: var(--support); font-size: .85rem; }
.images figure { margin: 0; }
.bar { display: grid; grid-template-columns: minmax(110px, 1fr) 3fr 3.2em; gap: 8px; align-items: center; margin: 4px 0; font-size: .92rem; }
.bar .track { height: 10px; background: var(--surface); border-radius: 5px; overflow: hidden; border: 1px solid var(--support); }
.bar .fill { height: 100%; background: var(--accent); }
.bar .num { text-align: right; font-variant-numeric: tabular-nums; }
details { margin-top: 24px; }
details summary { cursor: pointer; color: var(--primary); }
label.api { display: block; margin-top: 8px; }
input[type=text] { width: 100%; padding: 8px; font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--support); border-radius: 6px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Face Analysis</h1>
  <p class="muted">Upload a photo to get landmarks, expression, pose, demographics and image quality.</p>

  <form id="form">
    <label id="drop" for="file">
      <input type="file" id="file" name="file" accept="image/*">
      <strong>Choose an image</strong> or drag and drop it here
      <div id="filename" class="muted">No file selected</div>
      <img id="preview" alt="Preview of the selected image">
    </label>
    <div class="actions">
      <button type="submit" id="submit" disabled>Analyze</button>
      <span id="status" role="status" aria-live="polite"></span>
    </div>
    <details>
      <summary>Service settings</summary>
      <label class="api">Face analysis service URL (blank = this server)
        <input type="text" id="base" placeholder="http://localhost:8000" autocomplete="off">
      </label>
    </details>
  </form>

  <section id="report" hidden aria-label="Analysis report"></section>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const form = $("form"), drop = $("drop"), fileInput = $("file"), preview = $("preview");
const submit = $("submit"), statusEl = $("status"), report = $("report"), baseInput = $("base");
let file = null, objectUrl = null, annotatedUrl = null;

try { baseInput.value = localStorage.getItem("face-analysis-base") || ""; } catch (e) {}

function setStatus(msg, isError) {
  statusEl.textContent = msg;
  statusEl.className = isError ? "error" : "";
}

function setFile(f) {
  if (!f) return;
  if (!f.type.startsWith("image/")) { setStatus("Please choose an image file.", true); return; }
  file = f;
  if (objectUrl) URL.revokeObjectURL(objectUrl);
  objectUrl = URL.createObjectURL(f);
  preview.src = objectUrl;
  preview.style.display = "block";
  $("filename").textContent = `${f.name} (${(f.size / 1024).toFixed(0)} KB)`;
  submit.disabled = false;
  setStatus("");
}

fileInput.addEventListener("change", () => setFile(fileInput.files[0]));
for (const ev of ["dragenter", "dragover"]) {
  drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); });
}
for (const ev of ["dragleave", "drop"]) {
  drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); });
}
drop.addEventListener("drop", (e) => {
  const f = e.dataTransfer.files[0];
  if (f) {
    try { const dt = new DataTransfer(); dt.items.add(f); fileInput.files = dt.files; } catch (err) {}
    setFile(f);
  }
});
// Prevent the browser from navigating to a file dropped outside the drop zone.
for (const ev of ["dragover", "drop"]) window.addEventListener(ev, (e) => e.preventDefault());

function apiBase() {
  return baseInput.value.trim().replace(/\/+$/, "");
}

async function post(path, body) {
  const res = await fetch(apiBase() + path, { method: "POST", body });
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).detail || detail; } catch (e) {}
    throw new Error(`${res.status}: ${detail}`);
  }
  return res;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!file) return;
  try { localStorage.setItem("face-analysis-base", baseInput.value.trim()); } catch (err) {}
  submit.disabled = true;
  setStatus("Analyzing… the first request can take a while.");
  report.hidden = true;
  const make = () => { const fd = new FormData(); fd.append("file", file, file.name); return fd; };
  try {
    const annotatedP = post("/analyze/annotated", make()).then((r) => r.blob()).catch(() => null);
    const result = await (await post("/analyze", make())).json();
    const annotated = await annotatedP;
    if (annotatedUrl) URL.revokeObjectURL(annotatedUrl);
    annotatedUrl = annotated ? URL.createObjectURL(annotated) : null;
    render(result);
    setStatus("Done.");
  } catch (err) {
    setStatus(`Analysis failed: ${err.message}`, true);
  } finally {
    submit.disabled = false;
  }
});

function el(tag, props, ...children) {
  const n = document.createElement(tag);
  if (props) Object.assign(n, props);
  for (const c of children) n.append(c);
  return n;
}
const fmt = (v, d = 1) => (typeof v === "number" ? v.toFixed(d) : "—");
const pct = (v) => (typeof v === "number" ? `${(v * 100).toFixed(0)}%` : "—");

function card(label, value) {
  return el("div", { className: "card" }, el("div", { className: "label", textContent: label }),
    el("div", { className: "value", textContent: value }));
}
function bar(label, v) {
  const w = Math.max(0, Math.min(1, v || 0)) * 100;
  const fill = el("div", { className: "fill" });
  fill.style.width = `${w}%`;
  return el("div", { className: "bar" }, el("span", { textContent: label }),
    el("div", { className: "track" }, fill), el("span", { className: "num", textContent: pct(v) }));
}
function section(title, ...nodes) {
  return el("div", null, el("h2", { textContent: title }), ...nodes);
}
const grid = (...cards) => el("div", { className: "grid" }, ...cards);

function humanize(k) {
  return k.replace(/([A-Z])/g, " $1").replace(/^./, (c) => c.toUpperCase());
}

function render(r) {
  report.replaceChildren();
  report.hidden = false;
  report.append(el("h2", { textContent: "Report" }));

  if (r.error || !r.face_detected) {
    report.append(el("p", { className: "muted", textContent: r.error || "No face detected in this image." }));
    return;
  }

  const imgs = el("div", { className: "images" });
  const fig = (src, cap) => el("figure", null, el("img", { src, alt: cap }), el("figcaption", { textContent: cap }));
  imgs.append(fig(objectUrl, "Original"));
  if (annotatedUrl) imgs.append(fig(annotatedUrl, `Landmarks (${r.total_landmarks ?? "?"})`));
  report.append(imgs);

  const ins = r.insightface || {};
  report.append(section("Summary", grid(
    card("Gender", ins.gender || "—"),
    card("Estimated age", ins.age ?? "—"),
    card("Detection confidence", pct(ins.detection_confidence)),
    card("Gaze", (r.eye_gaze && r.eye_gaze.gaze_direction) || "—"),
  )));

  const hp = r.head_pose || {};
  report.append(section("Head pose", grid(
    card("Pitch", `${fmt(hp.pitch_degrees)}°`),
    card("Yaw", `${fmt(hp.yaw_degrees)}°`),
    card("Roll", `${fmt(hp.roll_degrees)}°`),
  )));

  const fe = r.facial_expression || {};
  const exprBars = [["Smile", fe.smile_intensity], ["Cheek raise", fe.cheek_raise_intensity],
    ["Frown", fe.frown_intensity], ["Mouth pucker", fe.mouth_pucker]]
    .filter(([, v]) => typeof v === "number").map(([l, v]) => bar(l, v));
  if (exprBars.length) report.append(section("Expression", ...exprBars));

  const fh = r.facial_hair_indicators || {};
  if (Object.keys(fh).length) {
    report.append(section("Facial hair",
      bar("Mustache", fh.mustache_probability), bar("Beard", fh.beard_probability)));
  }

  const ip = r.image_properties;
  if (ip) {
    const c = ip.mean_color_bgr || {};
    report.append(section("Image quality", grid(
      card("Resolution", ip.resolution ? `${ip.resolution.width}×${ip.resolution.height}` : "—"),
      card("Brightness", fmt(ip.brightness)),
      card("Contrast", fmt(ip.contrast)),
      card("Sharpness", fmt(ip.sharpness)),
      card("Mean RGB", `${fmt(c.red, 0)}, ${fmt(c.green, 0)}, ${fmt(c.blue, 0)}`),
    )));
  }

  const bs = Object.entries(r.blendshapes || {})
    .filter(([k]) => k !== "_neutral").sort((a, b) => b[1] - a[1]).slice(0, 10);
  if (bs.length) report.append(section("Top blendshapes", ...bs.map(([k, v]) => bar(humanize(k), v))));

  const dl = el("button", { type: "button", className: "secondary", textContent: "Download full JSON" });
  dl.addEventListener("click", () => {
    const url = URL.createObjectURL(new Blob([JSON.stringify(r, null, 2)], { type: "application/json" }));
    const a = el("a", { href: url, download: "analysis.json" });
    a.click();
    URL.revokeObjectURL(url);
  });
  report.append(el("div", { className: "actions" }, dl));
  report.scrollIntoView({ behavior: "smooth" });
}
</script>
</body>
</html>
