name: sworn

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'sworn/**'
      - '.github/workflows/sworn.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'sworn/**'
      - '.github/workflows/sworn.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sworn

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: sworn/go.sum

      - name: Run tests
        run: CGO_ENABLED=1 go test -tags sqlite_fts5 -race -v ./...
        working-directory: sworn

      - name: Run go vet
        run: CGO_ENABLED=1 go vet -tags sqlite_fts5 ./...
        working-directory: sworn

      - name: Check formatting
        run: test -z "$(gofmt -l .)"
        working-directory: sworn

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build Docker image (PR, no push)
        uses: docker/build-push-action@v5
        with:
          context: ./sworn
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        if: github.event_name == 'pull_request'

      - name: Build and push Docker image
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: ./sworn
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        if: github.event_name != 'pull_request'

      - name: Image digest
        if: github.event_name != 'pull_request'
        run: echo ${{ steps.docker_build.outputs.digest }}
