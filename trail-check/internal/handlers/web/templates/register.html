{{define "title"}}Register - Trail Check{{end}}
{{define "content"}}
<section class="auth-card">
  <h1>Create your account</h1>
  <p>Trail Check has no passwords. Registering creates a passkey on this device that you'll use to sign in.</p>

  <div class="field">
    <label for="passkey-label">Label this passkey (optional)</label>
    <input type="text" id="passkey-label" placeholder="e.g. iPhone, YubiKey">
  </div>

  <button id="register-button" type="button">Create passkey</button>
  <p id="register-status" role="status"></p>
</section>
<script>
  document.getElementById('register-button').addEventListener('click', function () {
    TrailCheck.register({
      label: document.getElementById('passkey-label').value,
      statusEl: document.getElementById('register-status'),
    });
  });
</script>
{{end}}
